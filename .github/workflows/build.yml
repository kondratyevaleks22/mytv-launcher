name: Сборка APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk MyTV-Launcher.apk

      - name: Выложить APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: MyTV-Launcher
          path: MyTV-Launcher.apk
